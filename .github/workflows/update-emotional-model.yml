name: Update Emotional Model

# Run weekly on Sundays at 2 AM UTC
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-model:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch feedback data from Supabase
        id: fetch-feedback
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/fetch-feedback.js

      - name: Update model weights
        run: |
          node scripts/update-model-weights.js

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet src/lib/emotion-model.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/lib/emotion-model.json
          git commit -m "chore: update emotional model weights [automated]"
          git push

      - name: Create summary
        run: |
          echo "## Emotional Model Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ Model weights updated and committed" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No significant changes to model weights" >> $GITHUB_STEP_SUMMARY
          fi
